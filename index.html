        <script>
          (function () {
            var IMAGE_MAP = {
              /* Hero & exterior */
              "iTowers Exente at golden hour": "images/overview.jpg",
              "Exente exterior":               "images/exterior3.jpg",
              "Gardens":                       "images/gardens.jpg",
              "Pool":                          "images/pool.jpg",

              "Landscaped Gardens":            "images/gardens.jpg",
              "Tennis & Basketball Courts":    "images/tennis.jpg",
              "State-of-the-art Gym":          "images/gym.jpg",
              "Kids' Play Zone & Pool":        "images/kids_play.jpg",
              "Jogging Track & Party Lawn":    "images/pergola.jpg",
              /* Community events — use real society images */
              "Republic Day Carnival":         "images/entrance3.jpg",
              "Holi at Exente":                "images/view.jpg",
              "Summer Swim Camp":              "images/pool.jpg"
            };

            function replaceImages() {
              document.querySelectorAll('img').forEach(function (img) {
                var replacement = IMAGE_MAP[img.alt];
                if (replacement && img.src.indexOf('/images/') === -1) {
                  img.src = replacement;
                }
              });
            }

            var interval = setInterval(function () {
              replaceImages();
            }, 200);

            // Stop polling after 10s — MutationObserver takes over
            setTimeout(function () {
              clearInterval(interval);
              var observer = new MutationObserver(replaceImages);
              observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
            }, 10000);
          })();
        </script>

            function patchVendorCards() {
              VENDORS.forEach(function(v, i) {
                document.querySelectorAll('[data-testid="vendor-card-' + i + '"]').forEach(function(card) {
                  if (card.dataset.vendorPatched === v.name) return;
                  card.dataset.vendorPatched = v.name;
                  var img = card.querySelector('img');
                  if (img) { img.src = v.img; img.alt = v.name; }
                  var cat = card.querySelector('div.text-\\[11px\\]') || card.querySelector('[class*="uppercase"][class*="tracking"]');
                  if (cat) cat.textContent = v.category;
                  var h3 = card.querySelector('h3');
                  if (h3) h3.textContent = v.name;
                  var offer = card.querySelector('span.text-sm');
                  if (offer) offer.textContent = v.tag;
                });
              });
              /* Inject Crèche only into the source band — the clone picks it up via the loop */
              document.querySelectorAll('.rfm-initial-child-container').forEach(function(band) {
                if (false) return; /* placeholder */
                if (band.querySelector('[data-creche]')) return;
                var template = band.querySelector('article[data-testid^="vendor-card-"]');
                if (!template) return;
                var clone = template.cloneNode(true);
                delete clone.dataset.testid;
                clone.dataset.creche = '1';
                var img = clone.querySelector('img'); if (img) { img.src = EXTRA_VENDOR.img; img.alt = EXTRA_VENDOR.name; }
                var cat = clone.querySelector('[class*="uppercase"][class*="tracking"]'); if (cat) cat.textContent = EXTRA_VENDOR.category;
                var h3 = clone.querySelector('h3'); if (h3) h3.textContent = EXTRA_VENDOR.name;
                var offer = clone.querySelector('span.text-sm'); if (offer) offer.textContent = EXTRA_VENDOR.tag;
                band.appendChild(clone);
              });
            }

            function injectSponsorsSection() {
              if (window.location.pathname !== '/' && window.location.pathname !== '') return;

                      '</div>' +
                    '</a>';
                });
              }

              /* Always show 3 "Your brand here" slots if fewer than 3 real sponsors */
              var emptySlots = Math.max(0, 3 - SPONSORS.length);
              for (var i = 0; i < emptySlots; i++) {
                sponsorCards +=

                '</div>';

              marquee.insertAdjacentElement('afterend', section);
            }

            setInterval(injectSponsorsSection, 300);

            function patchAmenitiesCreche() {
              var path = window.location.pathname;
              if (path !== '/' && path !== '' && !path.startsWith('/amenities')) return;
              if (document.querySelector('[data-creche-amenity]')) return;
              /* Find the grid that actually holds amenity cards */
              var firstCard = document.querySelector('[data-testid="amenity-card-0"]');
              if (!firstCard) return;
              var grid = firstCard.parentElement;
              if (!grid) return;
              var card = document.createElement('article');
              card.setAttribute('data-creche-amenity', '1');
              card.className = 'relative group overflow-hidden rounded-2xl border border-brand-sage bg-brand-sage/30';
              card.style.cssText = 'grid-column: 1 / -1; min-height: 260px;';
              card.innerHTML =
                '<img src="https://images.pexels.com/photos/1001914/pexels-photo-1001914.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Crèche" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />' +
                '<div class="absolute inset-0" style="background:linear-gradient(to top,rgba(26,54,34,0.9),rgba(26,54,34,0.3),transparent)"></div>' +
                '<div class="relative h-full flex flex-col justify-end p-6 md:p-8">' +
                  '<h3 class="font-display text-2xl md:text-3xl" style="color:#FAF8F4">Crèche</h3>' +
                  '<p class="text-sm mt-2 max-w-md leading-relaxed" style="color:rgba(250,248,244,0.85)">Safe, nurturing childcare within the community</p>' +
                '</div>';
              grid.appendChild(card);
            }

            setInterval(patchAmenitiesCreche, 300);
            /* Dedicated interval: hides committee section whenever React re-renders it */
            setInterval(removeCommitteeSection, 300);

            var patching = false;
            var timer = null;

            function schedule() {
              if (timer) clearTimeout(timer);
              timer = setTimeout(function () {
                if (patching) return;
                patching = true;
                patchTextNodes();
                removePhone();
                removeWhatsApp();
                patchEmailHrefs();
                removeLiItems();
                removeCards();
                patchPolicyLinks();
                patchContactForm();
                removeSentences();
                removeCommitteeSection();
                injectSponsorsSection();
                injectEventsSection();
                patchAmenitiesCreche();
                patchVendorCards();
                patchNavLocation();
                patching = false;
              }, 120);
            }

            var observer = new MutationObserver(function () {
              if (!patching) schedule();
            });

            /* document.body is null while <head> scripts run — defer until DOM ready */
            document.addEventListener('DOMContentLoaded', function () {
              observer.observe(document.body, { childList: true, subtree: true });
              setTimeout(schedule, 400);
            });
            /* Re-run after React Router navigates (pushState doesn't fire popstate) */
            (function() {
              var orig = history.pushState.bind(history);
              history.pushState = function() {
                orig.apply(history, arguments);
                setTimeout(schedule, 300);
                setTimeout(schedule, 700);
              };
            })();
            window.addEventListener('popstate', function() { setTimeout(schedule, 300); });
          })();
        </script>

              document.title = page.title;

              if (canon) canon.setAttribute('href', 'https://itowersexente.com' + (path === '/' ? '/' : path));
            }
            applyMeta();
            ['pushState','replaceState'].forEach(function(m) {
              var orig = history[m];
              history[m] = function() { orig.apply(this, arguments); applyMeta(); };
            });

              var links = footer.querySelectorAll('a');
              if (!links.length) return;
              var lastLink = links[links.length - 1];
              var sep = document.createTextNode(' · ');
              var a = document.createElement('a');
              a.href = '/privacy-policy.html';
              a.textContent = 'Privacy Policy';
              a.setAttribute('data-privacy-link', '1');
              a.style.cssText = lastLink.style.cssText;
              a.className = lastLink.className;
              lastLink.parentNode.appendChild(sep);
              lastLink.parentNode.appendChild(a);
            }
            setInterval(injectPrivacyLink, 500);
