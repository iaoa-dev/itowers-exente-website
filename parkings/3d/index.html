<style>

<script type="module">
import * as THREE from './three.module.min.js';

const SCALE = 0.25;          // metres per drawing point (estimated from slot pitch; tweak if tape-measure says otherwise)
const WALL_H = 3.0, EYE = 1.6, RADIUS = 0.35;
const LEVELS = {'Basement-1': {key:'b1', img:'../basement-1.png'}, 'Basement-2': {key:'b2', img:'../basement-2.png'}};
const touch = matchMedia('(pointer:coarse)').matches || /[?&]touch=1/.test(location.search);   // ?touch=1 previews the phone controls on a laptop

const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({canvas:$('view'), antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);
scene.fog = new THREE.Fog(0x1b1d21, 10, 70);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 120);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x3a3d45, 0.85));
const lamp = new THREE.PointLight(0xfff3dd, 6, 12, 1.6); camera.add(lamp);

const DATA = {};
let level = null, L = null, grid = null, group = null, signs = new Map(), marker = null, miniImg = new Image();
const player = {x:0, z:0, yaw:0, pitch:0};

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

async function load(key) { if (!DATA[key]) DATA[key] = await (await fetch(key + '.json')).json(); return DATA[key]; }

function walkable(x, z) {   // world metres -> mask lookup
  const cx = Math.floor(x / SCALE / L.cell), cy = Math.floor(z / SCALE / L.cell);
  return cx >= 0 && cy >= 0 && cx < L.W && cy < L.H && grid[cy * L.W + cx] === 1;
}
const free = (x, z) => walkable(x + RADIUS, z) && walkable(x - RADIUS, z) && walkable(x, z + RADIUS) && walkable(x, z - RADIUS);

// ---------- procedural textures ----------
function noiseCanvas(w, h, base, spread, speck) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < speck; i++) { const v = Math.random() * spread | 0; g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * 0.07})`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 1 + Math.random() * 3); }
  return c;
}
const tex = (c, rep) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (rep) t.repeat.set(rep[0], rep[1]); return t; };
function wallTexture() {            // 3 m x 3 m tile: concrete, formwork joints, painted dado
  const c = noiseCanvas(256, 256, '#cfcdc6', 30, 5000), g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(0, 0, 2, 256); g.fillRect(0, 85, 256, 1.5); g.fillRect(0, 170, 256, 1.5);
  g.fillStyle = '#5f646c'; g.fillRect(0, 256 - 92, 256, 92);                       // dark dado to 1.1 m
  g.fillStyle = '#f5c518'; g.fillRect(0, 256 - 96, 256, 4);                        // yellow line on top of dado
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, 256 - 4, 256, 4);                  // skirting shadow
  return tex(c);
}
function pillarTexture() {          // concrete column with hazard stripes at car-bumper height + number-less
  const c = noiseCanvas(128, 256, '#c4c2bb', 30, 3000), g = c.getContext('2d');
  g.save(); g.beginPath(); g.rect(0, 256 - 100, 128, 70); g.clip(); g.fillStyle = '#f5c518'; g.fillRect(0, 256 - 100, 128, 70);
  g.fillStyle = '#111'; for (let x = -100; x < 260; x += 36) { g.beginPath(); g.moveTo(x, 256 - 30); g.lineTo(x + 18, 256 - 30); g.lineTo(x + 18 + 70, 256 - 100); g.lineTo(x + 70, 256 - 100); g.fill(); } g.restore();
  g.fillStyle = '#5f646c'; g.fillRect(0, 256 - 30, 128, 30);
  return tex(c);
}
const matCache = {};
function mats() {
  if (!matCache.wall) {
    matCache.wall = new THREE.MeshLambertMaterial({map: wallTexture(), side: THREE.DoubleSide});
    matCache.pillar = new THREE.MeshLambertMaterial({map: pillarTexture(), side: THREE.DoubleSide});
    matCache.ceil = new THREE.MeshLambertMaterial({map: tex(noiseCanvas(256, 256, '#a7a8a8', 30, 6000), [1, 1]), side: THREE.DoubleSide});
    matCache.beam = new THREE.MeshLambertMaterial({color: 0x8e8f90});
    matCache.pipe = new THREE.MeshLambertMaterial({color: 0xc23b2a});
    matCache.duct = new THREE.MeshLambertMaterial({color: 0x9aa3ad});
    matCache.light = new THREE.MeshBasicMaterial({color: 0xfffbea, fog: false});
  }
  return matCache;
}

function wallGeometry(loops, height) {   // loops: walkable on the right-hand side of travel direction
  const pos = [], nor = [], uv = [], idx = []; let acc;
  for (const lp of loops) {
    acc = 0;
    for (let i = 0; i < lp.length; i += 2) {
      const ax = lp[i] * SCALE, az = lp[i + 1] * SCALE, j = (i + 2) % lp.length, bx = lp[j] * SCALE, bz = lp[j + 1] * SCALE;
      const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz); if (len < 1e-4) continue;
      const nx = -dz / len, nz = dx / len, v = pos.length / 3;
      pos.push(ax, 0, az, bx, 0, bz, bx, height, bz, ax, height, az);
      for (let k = 0; k < 4; k++) nor.push(nx, 0, nz);
      uv.push(acc / 3, 0, (acc + len) / 3, 0, (acc + len) / 3, height / 3, acc / 3, height / 3);
      idx.push(v, v + 1, v + 2, v, v + 2, v + 3); acc += len;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
}

function floorCanvas(bx0, bx1, bz0, bz1) {
  const ppp = Math.min(4096 / ((bx1 - bx0) / SCALE), 4096 / ((bz1 - bz0) / SCALE));      // canvas px per drawing point
  const w = Math.ceil((bx1 - bx0) / SCALE * ppp), h = Math.ceil((bz1 - bz0) / SCALE * ppp);
  const c = noiseCanvas(w, h, '#7d7f84', 30, 90000), g = c.getContext('2d');
  const ox = bx0 / SCALE, oz = bz0 / SCALE, P = (x, y) => [(x - ox) * ppp, (y - oz) * ppp];
  // faint tyre-polished lanes + stains
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(20,20,25,${0.02 + Math.random() * 0.04})`; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, 20 + Math.random() * 90, 8 + Math.random() * 30, Math.random() * 3, 0, 7); g.fill(); }
  g.lineJoin = 'miter'; g.lineCap = 'butt';
  for (const s of L.slots) {                                 // painted bay markings
    const q = s.q; g.strokeStyle = s.flat ? 'rgba(250,250,245,.95)' : 'rgba(250,250,245,.7)'; g.lineWidth = Math.max(1.6, 0.11 / SCALE * ppp);
    g.beginPath(); const p0 = P(q[0], q[1]); g.moveTo(...p0); for (let i = 2; i < 8; i += 2) g.lineTo(...P(q[i], q[i + 1])); g.closePath(); g.stroke();
    // bay number painted on the tarmac, baseline along the short edge
    const cx = (q[0] + q[2] + q[4] + q[6]) / 4, cy = (q[1] + q[3] + q[5] + q[7]) / 4;
    const e1 = [q[2] - q[0], q[3] - q[1]], e2 = [q[4] - q[2], q[5] - q[3]], short = Math.hypot(...e1) < Math.hypot(...e2) ? e1 : e2;
    let ang = Math.atan2(short[1], short[0]); if (Math.abs(ang) > Math.PI / 2) ang += Math.PI;
    const [px, py] = P(cx, cy); g.save(); g.translate(px, py); g.rotate(ang);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `bold ${Math.round(0.55 / SCALE * ppp)}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s.n, 0, 0); g.restore();
  }
  return c;
}

function buildLevel(name) {
  if (group) { scene.remove(group); group.traverse(o => { o.geometry && o.geometry.dispose(); if (o.material && o.material.map && !Object.values(matCache).includes(o.material)) o.material.map.dispose(); }); }
  signs.forEach(s => s.material.map.dispose()); signs = new Map();
  level = name; L = DATA[LEVELS[name].key]; const M = mats();
  grid = new Uint8Array(L.W * L.H);
  L.mask.forEach((runs, y) => runs.forEach(([s, n]) => grid.fill(1, y * L.W + s, y * L.W + s + n)));
  group = new THREE.Group(); scene.add(group);
  const cw = L.cell * SCALE, W = L.W, H = L.H;
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const bx0 = (x0 - 2) * cw, bx1 = (x1 + 3) * cw, bz0 = (y0 - 2) * cw, bz1 = (y1 + 3) * cw, cxm = (bx0 + bx1) / 2, czm = (bz0 + bz1) / 2;

  if (L.walls.length) group.add(new THREE.Mesh(wallGeometry(L.walls, WALL_H), M.wall));   // none by default: only the solid black boxes of the plan are built
  const dummy = new THREE.Object3D();
  const colMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.pillar, L.cols.length);   // columns = the black rectangles on the plan
  L.cols.forEach(([x, y, w, h], i) => { dummy.position.set(x * SCALE, WALL_H / 2, y * SCALE); dummy.rotation.set(0, 0, 0); dummy.scale.set(w * SCALE, WALL_H, h * SCALE); dummy.updateMatrix(); colMesh.setMatrixAt(i, dummy.matrix); });
  group.add(colMesh);
  const wbMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.wall, L.wb.length);       // lobby / lift / stair room walls (double lines on the plan)
  L.wb.forEach(([x, y, w, h], i) => { dummy.position.set((x + w / 2) * SCALE, WALL_H / 2, (y + h / 2) * SCALE); dummy.rotation.set(0, 0, 0); dummy.scale.set(w * SCALE, WALL_H, h * SCALE); dummy.updateMatrix(); wbMesh.setMatrixAt(i, dummy.matrix); });
  group.add(wbMesh);

  const ft = new THREE.CanvasTexture(floorCanvas(bx0, bx1, bz0, bz1)); ft.colorSpace = THREE.SRGBColorSpace; ft.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(bx1 - bx0, bz1 - bz0), new THREE.MeshLambertMaterial({map: ft}));
  floor.rotation.x = -Math.PI / 2; floor.position.set(cxm, 0, czm); group.add(floor);

  const ct = M.ceil.map; ct.repeat.set((bx1 - bx0) / 6, (bz1 - bz0) / 6);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(bx1 - bx0, bz1 - bz0), M.ceil);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(cxm, WALL_H, czm); group.add(ceil);

  // concrete beams every ~7.5 m in both directions, only where there is floor below
  const beams = [], step = 7.5, bw = 0.3, bd = 0.5;
  for (let z = Math.ceil(bz0 / step) * step; z < bz1; z += step) { let s = null; for (let x = bx0; x <= bx1; x += 0.5) { const ok = walkable(x, z); if (ok && s === null) s = x; if ((!ok || x + 0.5 > bx1) && s !== null) { if (x - s > 1) beams.push([(s + x) / 2, z, x - s, bw, 0]); s = null; } } }
  for (let x = Math.ceil(bx0 / step) * step; x < bx1; x += step) { let s = null; for (let z = bz0; z <= bz1; z += 0.5) { const ok = walkable(x, z); if (ok && s === null) s = z; if ((!ok || z + 0.5 > bz1) && s !== null) { if (z - s > 1) beams.push([x, (s + z) / 2, bw, z - s, 0]); s = null; } } }
  const beamMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, bd, 1), M.beam, beams.length);
  beams.forEach(([x, z, sx, sz], i) => { dummy.position.set(x, WALL_H - bd / 2, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(sx, 1, sz); dummy.updateMatrix(); beamMesh.setMatrixAt(i, dummy.matrix); });
  group.add(beamMesh);

  // strip lights (emissive) + a pool of real point lights that follows the player
  lightPos = L.lights.map(([x, y, a]) => ({x: x * SCALE, z: y * SCALE, a}));
  const lightMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1.25, 0.06, 0.18), M.light, lightPos.length);
  lightPos.forEach((l, i) => { dummy.position.set(l.x, WALL_H - bd - 0.04, l.z); dummy.rotation.set(0, -l.a, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); lightMesh.setMatrixAt(i, dummy.matrix); });
  group.add(lightMesh);

  // fire-sprinkler pipe + duct running along the driveway centre-lines
  if (L.pipes.length) {
    const pipeMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 8), M.pipe, L.pipes.length);
    const ductMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.32, 0.55), M.duct, L.pipes.length);
    L.pipes.forEach(([ax, ay, bx, by], i) => {
      const dx = (bx - ax) * SCALE, dz = (by - ay) * SCALE, len = Math.hypot(dx, dz), ang = Math.atan2(dz, dx), mx = (ax + bx) / 2 * SCALE, mz = (ay + by) / 2 * SCALE;
      dummy.position.set(mx, WALL_H - bd - 0.12, mz); dummy.rotation.set(0, -ang, Math.PI / 2); dummy.scale.set(1, len + 0.12, 1); dummy.updateMatrix(); pipeMesh.setMatrixAt(i, dummy.matrix);
      dummy.position.set(mx - Math.sin(ang) * 0.9, WALL_H - bd - 0.2, mz + Math.cos(ang) * 0.9); dummy.rotation.set(0, -ang, 0); dummy.scale.set(len + 0.1, 1, 1); dummy.updateMatrix(); ductMesh.setMatrixAt(i, dummy.matrix);
    });
    group.add(pipeMesh); group.add(ductMesh);
  }

  marker = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, WALL_H, 10, 1, true), new THREE.MeshBasicMaterial({color: 0xf97316, transparent: true, opacity: 0.55}));
  marker.visible = false; group.add(marker);
  miniImg = new Image(); miniImg.src = LEVELS[name].img;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.l === name));
}

const lamps = Array.from({length: 5}, () => { const l = new THREE.PointLight(0xfff1d6, 5, 16, 1.8); scene.add(l); return l; });
let lightPos = [];
function updateLamps() {      // light the nearest fixtures so aisles look lit without hundreds of lights
  const near = lightPos.map(l => ({l, d: (l.x - player.x) ** 2 + (l.z - player.z) ** 2})).sort((a, b) => a.d - b.d).slice(0, lamps.length);
  lamps.forEach((lp, i) => { const n = near[i]; lp.visible = !!n; if (n) lp.position.set(n.l.x, WALL_H - 0.7, n.l.z); });
}

// slot number plates hung from the ceiling, created lazily for slots near the player
function plate(s) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = s.flat ? '#1d4ed8' : '#4b5563'; g.beginPath(); g.roundRect(4, 4, 248, 120, 14); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = 'bold 54px sans-serif'; g.fillText(s.n, 128, 62);
  g.font = 'bold 40px sans-serif'; g.fillStyle = s.flat ? '#fde68a' : '#d1d5db'; g.fillText(s.flat || 'no owner', 128, 108);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, fog:true})); sp.scale.set(1.25, 0.625, 1);
  sp.position.set(s.x * SCALE, 2.25, s.y * SCALE); return sp;
}
function updateSigns() {
  const px = player.x, pz = player.z, R2 = 24 * 24;
  for (const s of L.slots) {
    const dx = s.x * SCALE - px, dz = s.y * SCALE - pz, near = dx * dx + dz * dz < R2;
    let sp = signs.get(s);
    if (near && !sp) { sp = plate(s); signs.set(s, sp); group.add(sp); }
    if (sp) sp.visible = near;
  }
}

// ---------- people walking around (procedural, no downloads) ----------
let peopleOn = !/[?&]people=0/.test(location.search), people = [], peopleGroup = null;
const SKIN = [0xf1c8a5, 0xe0ac86, 0xc68642, 0x9a6a47, 0x6b4430, 0xf5d3b8];
const HAIR = [0x1a1410, 0x2b1d14, 0x4a3224, 0x7a5a3a, 0x8a8a8a, 0x111111, 0x3a2a20];
const TOP = [0x2b5fa8, 0xb8322a, 0x2f7d4f, 0xe8e2d0, 0x6b4f9e, 0x1f2937, 0xd4883a, 0x3c8fa8, 0xc9507a, 0x8a8f3a];
const BOTTOM = [0x1e2a44, 0x2a2a2e, 0x4a4a52, 0x6a5a45, 0x24344f, 0x8a7a62];
const pick = a => a[Math.random() * a.length | 0];
const lam = c => new THREE.MeshLambertMaterial({color: c});

function makePerson() {
  const female = Math.random() < 0.45, s = (female ? 1.58 + Math.random() * 0.16 : 1.68 + Math.random() * 0.17) / 1.75;
  const skin = lam(pick(SKIN)), top = lam(pick(TOP)), bot = lam(pick(BOTTOM)), hair = lam(pick(HAIR)), shoe = lam(pick([0x151515, 0x3a2a20, 0xeeeeee, 0x2a3a5a]));
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body); body.scale.setScalar(s);
  const cap = (r, len, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 10), m); o.position.set(x, y, z); return o; };
  const leg = x => { const hip = new THREE.Group(); hip.position.set(x, 0.92, 0); hip.add(cap(female ? 0.07 : 0.078, 0.34, bot, 0, -0.24, 0));
    const knee = new THREE.Group(); knee.position.y = -0.46; knee.add(cap(0.06, 0.34, bot, 0, -0.23, 0));
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.07, 0.26), shoe); foot.position.set(0, -0.43, 0.05); knee.add(foot); hip.add(knee); body.add(hip); return {hip, knee}; };
  const arm = x => { const sh = new THREE.Group(); sh.position.set(x, 1.42, 0); sh.add(cap(0.045, 0.2, top, 0, -0.16, 0));
    const el = new THREE.Group(); el.position.y = -0.31; el.add(cap(0.04, 0.2, Math.random() < 0.4 ? top : skin, 0, -0.14, 0));
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), skin); hand.position.y = -0.3; el.add(hand); sh.add(el); body.add(sh); return {sh, el}; };
  const L = leg(-0.09), R = leg(0.09), AL = arm(-0.21 * (female ? 0.92 : 1)), AR = arm(0.21 * (female ? 0.92 : 1));
  const torso = cap(0.15, 0.3, top, 0, 1.2, 0); torso.scale.set(female ? 1.15 : 1.3, 1, 0.75); body.add(torso);
  const hips = cap(0.14, 0.06, bot, 0, 0.97, 0); hips.scale.set(female ? 1.3 : 1.2, 0.8, 0.8); body.add(hips);
  if (female && Math.random() < 0.5) { const sk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.24, 0.34, 14, 1, true), lam(pick(TOP))); sk.position.y = 0.8; sk.material.side = THREE.DoubleSide; body.add(sk); }
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.1, 8), skin); neck.position.y = 1.53; body.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 14, 12), skin); head.scale.set(0.92, 1.12, 1); head.position.y = 1.67; body.add(head);
  const cut = new THREE.Mesh(new THREE.SphereGeometry(0.113, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), hair); cut.scale.set(0.95, 1.1, 1.02); cut.position.set(0, 1.685, -0.012); body.add(cut);
  if (female && Math.random() < 0.6) { const lh = cap(0.085, 0.2, hair, 0, 1.55, -0.07); lh.scale.set(1, 1, 0.7); body.add(lh); }
  return {root, L, R, AL, AR, body, s, ph: Math.random() * 6.28, speed: 0.95 + Math.random() * 0.6, heading: Math.random() * 6.28, pause: Math.random() * 3, path: null, fails: 0, pi: 0, stuckT: 0, lx: 0, lz: 0, x: 0, z: 0};
}

function spawnPeople() {
  if (peopleGroup) { group.remove(peopleGroup); peopleGroup = null; }
  people = [];
  if (!peopleOn || !lightPos.length) return;
  buildNav();
  peopleGroup = new THREE.Group(); group.add(peopleGroup);
  const n = touch ? 6 : 14;
  for (let tries = 0; people.length < n && tries < 400; tries++) {
    const l = lightPos[Math.random() * lightPos.length | 0], x = l.x + (Math.random() - 0.5) * 3, z = l.z + (Math.random() - 0.5) * 3;
    if (!inMain(x, z) || Math.hypot(x - player.x, z - player.z) < 8 || people.some(p => Math.hypot(p.x - x, p.z - z) < 5)) continue;
    const p = makePerson(); p.x = x; p.z = z; p.root.position.set(x, 0, z); peopleGroup.add(p.root); people.push(p);
  }
}

// coarse walkability grid + A* so people walk purposefully between places instead of wandering in circles
let nav = null;
function buildNav() {
  const cs = 0.6, w = Math.ceil(L.W * L.cell * SCALE / cs), h = Math.ceil(L.H * L.cell * SCALE / cs), ok = new Uint8Array(w * h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) ok[j * w + i] = free((i + 0.5) * cs, (j + 0.5) * cs) ? 1 : 0;
  // keep only the largest connected walkable region, so nobody spawns in a pocket they can't leave
  const comp = new Int32Array(w * h).fill(-1), sizes = []; let id = 0;
  for (let k0 = 0; k0 < w * h; k0++) { if (!ok[k0] || comp[k0] >= 0) continue; const st = [k0]; comp[k0] = id; let n = 0;
    while (st.length) { const k = st.pop(); n++; const i = k % w, j = (k / w) | 0; for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const ni = i + di, nj = j + dj; if (ni >= 0 && nj >= 0 && ni < w && nj < h) { const nk = nj * w + ni; if (ok[nk] && comp[nk] < 0) { comp[nk] = id; st.push(nk); } } } }
    sizes.push(n); id++; }
  nav = {cs, w, h, ok, comp, main: sizes.indexOf(Math.max(...sizes))};
}
const inMain = (x, z) => { const i = x / nav.cs | 0, j = z / nav.cs | 0; return i >= 0 && j >= 0 && i < nav.w && j < nav.h && nav.comp[j * nav.w + i] === nav.main; };
function findPath(x0, z0, x1, z1) {
  const {cs, w, h, ok} = nav, cell = (x, z) => [Math.max(0, Math.min(w - 1, x / cs | 0)), Math.max(0, Math.min(h - 1, z / cs | 0))];
  const [sx, sz] = cell(x0, z0), [gx, gz] = cell(x1, z1); if (!ok[gz * w + gx]) return null;
  const g = new Float32Array(w * h).fill(1e9), from = new Int32Array(w * h).fill(-1), heap = [], push = (k, f) => { heap.push([f, k]); let i = heap.length - 1; while (i) { const q = (i - 1) >> 1; if (heap[q][0] <= heap[i][0]) break; [heap[q], heap[i]] = [heap[i], heap[q]]; i = q; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top[1]; };
  const hf = (i, j) => Math.hypot(i - gx, j - gz); g[sz * w + sx] = 0; push(sz * w + sx, hf(sx, sz)); let found = false, iters = 0;
  while (heap.length && iters++ < 60000) {
    const k = pop(), i = k % w, j = (k / w) | 0; if (i === gx && j === gz) { found = true; break; }
    for (let d = 0; d < 8; d++) {
      const dx = [1, -1, 0, 0, 1, 1, -1, -1][d], dz = [0, 0, 1, -1, 1, -1, 1, -1][d], ni = i + dx, nj = j + dz;
      if (ni < 0 || nj < 0 || ni >= w || nj >= h || !ok[nj * w + ni]) continue;
      if (dx && dz && (!ok[j * w + ni] || !ok[nj * w + i])) continue;       // no corner cutting
      const nk = nj * w + ni, ng = g[k] + (dx && dz ? 1.414 : 1); if (ng < g[nk]) { g[nk] = ng; from[nk] = k; push(nk, ng + hf(ni, nj)); }
    }
  }

  const path = []; for (let k = gz * w + gx; k !== -1; k = from[k]) path.push({x: ((k % w) + 0.5) * cs, z: (((k / w) | 0) + 0.5) * cs }); path.reverse();
  return path.filter((_, i) => i % 2 === 1 || i === path.length - 1);        // thin the points a little
}
function newGoal(p) {
  for (let t = 0; t < 8; t++) {
    const l = lightPos[Math.random() * lightPos.length | 0], d = Math.hypot(l.x - p.x, l.z - p.z); if (d < 15 || !inMain(l.x, l.z)) continue;
    const path = findPath(p.x, p.z, l.x, l.z); if (path && path.length > 3) { p.path = path; p.pi = 0; p.stuckT = 0; p.fails = 0; p.lx = p.x; p.lz = p.z; return; }
  }
  p.path = null; p.pause = 1;
  if (inMain(p.x, p.z) === false || ++p.fails > 3) {      // stranded: re-appear somewhere on a normal aisle
    for (let t = 0; t < 40; t++) { const l = lightPos[Math.random() * lightPos.length | 0]; if (inMain(l.x, l.z) && Math.hypot(l.x - player.x, l.z - player.z) > 8) { p.x = l.x; p.z = l.z; p.fails = 0; break; } }
  }
}

function updatePeople(dt) {
  for (const p of people) {
    const dP = Math.hypot(p.x - player.x, p.z - player.z), near = dP < 55; p.root.visible = near;      // far-away people keep walking too, just without drawing them
    let walking = true;
    if (p.pause > 0) { p.pause -= dt; walking = false; }
    else {
      if (!p.path) newGoal(p);
      if (p.path) {
        const t = p.path[p.pi], dx = t.x - p.x, dz = t.z - p.z, dist = Math.hypot(dx, dz);
        if (dist < 0.45) { p.pi++; if (p.pi >= p.path.length) { p.path = null; p.pause = 1.5 + Math.random() * 4; walking = false; } }
        else {
          const want = Math.atan2(dx, dz); let diff = ((want - p.heading + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          p.heading += Math.max(-3 * dt, Math.min(3 * dt, diff));
          const v = p.speed * (dP < 1.6 ? 0.4 : 1) * (Math.abs(diff) > 1 ? 0.4 : 1) * dt, nx = p.x + Math.sin(p.heading) * v, nz = p.z + Math.cos(p.heading) * v;
          if (free(nx, nz)) { p.x = nx; p.z = nz; } else if (free(nx, p.z)) p.x = nx; else if (free(p.x, nz)) p.z = nz; else p.stuckT += dt * 3;
          p.ph += p.speed * 4.3 * dt;
          p.stuckT += dt; if (p.stuckT > 3) { if (Math.hypot(p.x - p.lx, p.z - p.lz) < 0.8) { p.path = null; } p.stuckT = 0; p.lx = p.x; p.lz = p.z; }   // not getting anywhere: pick a new destination
        }
      }
    }
    if (!near) continue;
    const a = walking ? 1 : 0, ph = p.ph;
    if (!walking) p.ph = Math.round(p.ph / Math.PI) * Math.PI;
    p.L.hip.rotation.x = Math.sin(ph) * 0.5 * a;  p.R.hip.rotation.x = Math.sin(ph + Math.PI) * 0.5 * a;
    p.L.knee.rotation.x = Math.max(0, -Math.cos(ph)) * 0.9 * a; p.R.knee.rotation.x = Math.max(0, Math.cos(ph)) * 0.9 * a;
    p.AL.sh.rotation.x = -Math.sin(ph) * 0.4 * a;  p.AR.sh.rotation.x = Math.sin(ph) * 0.4 * a;
    p.AL.el.rotation.x = p.AR.el.rotation.x = -0.25 * a;
    p.body.position.y = Math.abs(Math.cos(ph)) * 0.025 * a * p.s;
    p.root.position.set(p.x, 0, p.z); p.root.rotation.y = p.heading;

}
$('ppl').onclick = () => { peopleOn = !peopleOn; $('ppl').textContent = 'People: ' + (peopleOn ? 'On' : 'Off'); $('ppl').classList.toggle('on', peopleOn); if (L) spawnPeople(); };
$('ppl').textContent = 'People: ' + (peopleOn ? 'On' : 'Off'); $('ppl').classList.toggle('on', peopleOn);

// ---------- movement ----------
const keys = new Set(); let moveStick = {x:0, y:0};
addEventListener('keydown', e => { if (document.activeElement === $('q')) return; keys.add(e.code); });
addEventListener('keyup', e => keys.delete(e.code));
let locked = false;
$('view').addEventListener('click', () => { if (!touch) $('view').requestPointerLock?.(); });
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === $('view'); });
document.addEventListener('mousemove', e => { if (locked) look(e.movementX, e.movementY, 0.0022); });
function look(dx, dy, k) { player.yaw -= dx * k; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy * k)); }

if (touch) { document.body.classList.add('touch'); setTimeout(() => { $('hint').style.opacity = 0; }, 8000); }
let lookStick = {x:0, y:0};
function makePad(el, onChange) {      // on-screen thumb stick; several can be held at once (one per thumb)
  const nub = el.querySelector('i'), R = 36; let id = null, cx = 0, cy = 0;
  const upd = e => { let dx = (e.clientX - cx) / R, dy = (e.clientY - cy) / R; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
    nub.style.transform = `translate(${dx * R}px,${dy * R}px)`; onChange({x:dx, y:dy}); };
  el.addEventListener('pointerdown', e => { if (id !== null) return; id = e.pointerId; el.setPointerCapture(id); const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; upd(e); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) upd(e); });
  const end = e => { if (e.pointerId !== id) return; id = null; nub.style.transform = ''; onChange({x:0, y:0}); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
makePad($('padL'), v => { moveStick = v; });
makePad($('padR'), v => { lookStick = v; });
// dragging anywhere else on the view also turns your head
const drags = new Map();
$('view').addEventListener('touchstart', e => { for (const t of e.changedTouches) drags.set(t.identifier, {x:t.clientX, y:t.clientY}); e.preventDefault(); }, {passive:false});
$('view').addEventListener('touchmove', e => { for (const t of e.changedTouches) { const s = drags.get(t.identifier); if (!s) continue; look(t.clientX - s.x, t.clientY - s.y, 0.005); s.x = t.clientX; s.y = t.clientY; } e.preventDefault(); }, {passive:false});
const endT = e => { for (const t of e.changedTouches) drags.delete(t.identifier); };
$('view').addEventListener('touchend', endT); $('view').addEventListener('touchcancel', endT);

function step(dt) {
  let f = 0, r = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1; if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD')) r += 1; if (keys.has('KeyA')) r -= 1;
  if (keys.has('ArrowLeft')) player.yaw += 1.8 * dt; if (keys.has('ArrowRight')) player.yaw -= 1.8 * dt;
  f -= moveStick.y; r += moveStick.x;
  player.yaw -= lookStick.x * 2.2 * dt; player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - lookStick.y * 1.4 * dt));
  const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 6.5 : 3.2) * dt, m = Math.hypot(f, r) || 1, k = Math.min(1, m) / m;
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const dx = (-sin * f + cos * r) * k * sp, dz = (-cos * f - sin * r) * k * sp;
  if (free(player.x + dx, player.z)) player.x += dx;
  if (free(player.x, player.z + dz)) player.z += dz;
}

function teleportToSlot(s, lv) {
  window.gtag && gtag('event', 'parking_search_select', {view: '3d'});
  const go = () => {
    const sx = s.x * SCALE, sz = s.y * SCALE;
    let best = null;
    for (const d of [3, 4, 2, 5, 1.5]) for (let a = 0; a < 16 && !best; a++) { const ang = a / 16 * Math.PI * 2, x = sx + Math.cos(ang) * d, z = sz + Math.sin(ang) * d; if (free(x, z)) best = {x, z}; }
    if (!best) best = {x:sx, z:sz};
    player.x = best.x; player.z = best.z; player.yaw = Math.atan2(-(sx - best.x), -(sz - best.z)); player.pitch = -0.12;
    marker.position.set(sx, WALL_H / 2, sz); marker.visible = true;
    $('card').innerHTML = `<b>Slot ${s.n}</b> · ${level}<br>${s.flat ? 'Flat <b style="font-size:17px">' + s.flat + '</b>' : 'No owner listed in the sheet'}`; $('card').style.display = 'block';
    updateSigns();
  };
  if (lv !== level) switchLevel(lv).then(go); else go();
}
async function switchLevel(name) { await load(LEVELS[name].key); buildLevel(name); marker.visible = false; $('card').style.display = 'none';
  const cx = L.slots.reduce((a, s) => a + s.x, 0) / L.slots.length * SCALE, cz = L.slots.reduce((a, s) => a + s.y, 0) / L.slots.length * SCALE;
  const start = lightPos.filter(l => free(l.x, l.z)).sort((a, b) => Math.hypot(a.x - cx, a.z - cz) - Math.hypot(b.x - cx, b.z - cz))[0] || {x: L.slots[0].x * SCALE, z: L.slots[0].y * SCALE};
  player.x = start.x; player.z = start.z; player.yaw = start.a ? -start.a - Math.PI / 2 : 0; player.pitch = 0; updateSigns(); updateLamps(); spawnPeople(); }

// ---------- search ----------
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const ALIAS = {B1:'Basement-1', B2:'Basement-2'};
function search(raw) {
  const q = norm(raw); if (!q) return [];
  const m = raw.trim().toUpperCase().match(/^(?:(B1|B2)[\s:#-]+)?(\d{1,3}[A-Z]?)$/), out = [];
  if (m) { const id = m[2].replace(/^0+(?=\d)/, ''); for (const lv in LEVELS) if (!m[1] || ALIAS[m[1]] === lv) for (const s of DATA[LEVELS[lv].key].slots) if (s.n === id) out.push({lv, s}); }
  for (const lv in LEVELS) for (const s of DATA[LEVELS[lv].key].slots) if (s.flat && norm(s.flat).includes(q) && !out.some(o => o.s === s)) out.push({lv, s});
  return out.slice(0, 20);
}
$('q').addEventListener('input', e => {
  const box = $('results'), res = e.target.value.trim() ? search(e.target.value) : [];
  box.innerHTML = ''; box.style.display = e.target.value.trim() ? 'block' : 'none';
  if (!res.length && e.target.value.trim()) box.innerHTML = '<div>No match</div>';
  for (const r of res) { const d = document.createElement('div'); d.innerHTML = `Slot <b>${r.s.n}</b> <small>${r.lv}</small> → <b>${r.s.flat || 'no owner'}</b>`;
    d.onclick = () => { box.style.display = 'none'; $('q').blur(); teleportToSlot(r.s, r.lv); }; box.appendChild(d); }
});

// ---------- minimap ----------
const mini = $('mini'), mg = mini.getContext('2d');
function drawMini() {
  mg.fillStyle = '#fff'; mg.fillRect(0, 0, mini.width, mini.height);
  if (miniImg.complete && miniImg.naturalWidth) mg.drawImage(miniImg, 0, 0, mini.width, mini.height);
  const px = player.x / SCALE / 595 * mini.width, pz = player.z / SCALE / 842 * mini.height;
  mg.save(); mg.translate(px, pz); mg.rotate(-player.yaw);
  mg.fillStyle = 'rgba(249,115,22,.35)'; mg.beginPath(); mg.moveTo(0, 0); mg.arc(0, 0, 38, -Math.PI / 2 - 0.6, -Math.PI / 2 + 0.6); mg.closePath(); mg.fill();
  mg.fillStyle = '#ea580c'; mg.beginPath(); mg.arc(0, 0, 7, 0, 7); mg.fill(); mg.restore();
}
mini.addEventListener('pointerdown', e => { const r = mini.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 595 * SCALE, z = (e.clientY - r.top) / r.height * 842 * SCALE; if (free(x, z)) { player.x = x; player.z = z; updateSigns(); } e.stopPropagation(); });

// ---------- boot ----------
for (const lv in LEVELS) { const b = document.createElement('button'); b.textContent = lv.replace('-', ' '); b.dataset.l = lv; b.onclick = () => switchLevel(lv); $('tabs').appendChild(b); }
$('hint').textContent = touch ? 'Left thumb: walk · Right thumb: look around · Tap the map to jump' : 'Click to look around · W A S D to walk · Shift to run · click the map to jump';
let last = performance.now(), acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; step(dt);
  camera.position.set(player.x, EYE, player.z); camera.rotation.set(player.pitch, player.yaw, 0);
  updatePeople(dt);
  if (marker) marker.material.opacity = 0.35 + 0.2 * Math.sin(t / 250);
  if ((acc += dt) > 0.25) { acc = 0; updateSigns(); updateLamps(); }
  drawMini(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
await Promise.all(Object.values(LEVELS).map(l => load(l.key)));
await switchLevel('Basement-1');
$('loading').style.display = 'none';
requestAnimationFrame(frame);
