    for (const l of levels) if (!only || only === l) for (const s of DATA.levels[l].slots) if (s.n === id) slots.push({kind:'slot', l, s});
    for (const rows of Object.values(DATA.flats)) for (const r of rows)   // levels with no plan (Ground Floor)
      if (!DATA.levels[r.loc] && r.slot === id && (!only || only === r.loc)) slots.push({kind:'slot', l:r.loc, s:{n:r.slot, flat:r.flat, type:r.type, note:r.note}, unmapped:true});
  }
  const flats = [];
  for (const [flat, rows] of Object.entries(DATA.flats)) if (norm(flat).includes(q)) flats.push({kind:'flat', flat, rows});
  return [...slots, ...flats].slice(0, 25);
}
function applySelection(keys, focus) {
  hits = new Set(keys); render();
  if (focus) { if (focus.l !== level) { level = focus.l; render(); } plan.complete ? focusSlot(focus.s) : plan.addEventListener('load', () => focusSlot(focus.s), {once:true}); showCard(focus.s); }
}
$('q').addEventListener('input', e => {
  const res = search(e.target.value), box = $('results');
  if (!e.target.value.trim()) { hits = new Set(); render(); box.style.display = 'none'; return; }
  box.innerHTML = res.length ? '' : '<div>No match</div>';
  for (const r of res) {
    const div = document.createElement('div');
    if (r.kind === 'flat') {
      div.innerHTML = `<b>${r.flat}</b> <small>${r.rows.map(x => `${x.loc} #${x.slot}`).join(' · ')}</small>`;
      div.onclick = () => {
        const keys = r.rows.map(x => x.loc + '|' + x.slot), first = r.rows.find(x => DATA.levels[x.loc]);
        const sl = first && DATA.levels[first.loc].slots.find(s => s.n === first.slot);
        box.style.display = 'none'; applySelection(keys, sl ? {l:first.loc, s:sl} : null);
      };
    } else {
      div.innerHTML = `Slot <b>${r.s.n}</b> <small>${r.l}</small> → <b>${r.s.flat || '<span style="color:var(--muted);font-weight:400">no owner in sheet</span>'}</b>`;
      div.onclick = () => {
        box.style.display = 'none';
        if (r.unmapped) { card.innerHTML = `<span class="x" onclick="card.style.display='none'">×</span><b>Slot ${r.s.n}</b> <span class="row">${r.l}</span><div class="flat">${r.s.flat}</div><div class="row">${r.s.type}${r.s.note ? ' · ' + r.s.note : ''} · no floor plan loaded for this level</div>`; card.style.display = 'block'; hits = new Set(); render(); }
        else applySelection([r.l + '|' + r.s.n], {l:r.l, s:r.s});
      };
    }
    box.appendChild(div);
  }
  box.style.display = 'block';
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('results').style.display = 'none'; });

// pan / zoom (mouse, touch, pinch)
const ptrs = new Map(); let last = null;
stage.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); stage.classList.add('drag'); last = null; });
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = {x:e.clientX, y:e.clientY};
  if (ptrs.size === 1) { view.x += cur.x - prev.x; view.y += cur.y - prev.y; setView(); }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const od = Math.hypot(a.x - b.x, a.y - b.y);
    ptrs.set(e.pointerId, cur); const [c, d] = [...ptrs.values()]; const nd = Math.hypot(c.x - d.x, c.y - d.y);
    const r = stage.getBoundingClientRect(); if (od > 0) zoomAt((c.x + d.x) / 2 - r.left, (c.y + d.y) / 2 - r.top, nd / od); return;
  }
  ptrs.set(e.pointerId, cur);
});
const up = e => { ptrs.delete(e.pointerId); if (!ptrs.size) stage.classList.remove('drag'); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015))); }, {passive:false});
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 1.8); });
window.addEventListener('resize', fit);

for (const l of levels) { const b = document.createElement('button'); b.textContent = l.replace('-', ' '); b.dataset.l = l; b.onclick = () => switchLevel(l); $('tabs').appendChild(b); }
render();
</script>
</body>
